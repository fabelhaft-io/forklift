version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # unclosed HTTP response bodies
    - errorlint     # error comparisons that break with wrapping
    - gosec         # common security mistakes
    - misspell
    - noctx         # HTTP requests without a context
    - nolintlint    # every //nolint must be specific and explained
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fabelhaft-io/forklift
